<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Periodic System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/topic-screen.css?v=20261015-ru1">
  <style>
    /* The mini periodic table on the Reading tab — drawn from the Memorizer's own
       data file, colored by the same three regions the game uses. */
    .mini-pt {
      display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px;
      margin: 14px 0 6px; max-width: 640px;
    }
    .mini-pt .cell {
      aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 600;
      font-size: clamp(0.34rem, 1.4vw, 0.62rem); color: var(--ink);
    }
    .mini-pt .gap { border: none; }
    .mini-pt .type-metal, .pt-legend .type-metal { background: var(--accent-soft); border-color: var(--accent); }
    .mini-pt .type-metalloid, .pt-legend .type-metalloid { background: var(--warning-soft); border-color: var(--warning-line); }
    .mini-pt .type-nonmetal, .pt-legend .type-nonmetal { background: var(--plum-soft); border-color: var(--plum); }
    .pt-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
    .pt-legend span {
      padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
      font-size: 0.78rem; font-weight: 600; color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="home-link" href="../" data-i18n="home">&larr; Home</a>
      <p class="eyebrow" data-i18n="eyebrow">Atoms &amp; the Periodic Table &middot; The Periodic System</p>
      <h1 data-i18n="title">The Periodic System</h1>
      <p class="lede" data-i18n="lede">One table holds every element &mdash; and its shape is the message. Learn to read the rows, the columns, and the trends that run across them.</p>
    </header>

    <section class="game" id="topic"></section>
  </main>

  <!-- Topic screen on the shared template (TOPIC_UNIVERSE_PLAN.md). All text comes from
       locale/{en,ru}.js; the mini table is rendered from the Memorizer's data. -->
  <script type="module">
    import { renderTopicScreen } from "../shared/js/topic-screen.js?v=20261015-ru1";
    import { ELEMENTS } from "./memorizer/data/pt-data.js?v=20261015-ru1";
    import { NAMES_RU } from "./memorizer/data/pt-names.ru.js?v=20261015-ru1";
    import { detectLang, makeT, elementName, applyStatic } from "../shared/js/i18n.js?v=20261015-ru1";
    import en from "./locale/en.js?v=20261015-ru1";
    import ru from "./locale/ru.js?v=20261015-ru1";

    const lang = detectLang();
    const t = makeT({ en, ru }, lang);
    const names = { ru: NAMES_RU }[lang];
    document.documentElement.lang = lang;
    document.title = t("title");
    applyStatic(t);

    const miniPT = `<div class="mini-pt">${ELEMENTS.map((e) =>
      `<div class="cell type-${e.type}" style="grid-row:${e.row + 1};grid-column:${e.col + 1}" title="${elementName(e, lang, names)} (${e.z})">${e.symbol}</div>`
    ).join("")}</div>
    <div class="pt-legend"><span class="type-metal">${t("legend_metal")}</span><span class="type-metalloid">${t("legend_metalloid")}</span><span class="type-nonmetal">${t("legend_nonmetal")}</span></div>`;

    renderTopicScreen(document.getElementById("topic"), {
      soonNote: t("soon_note"),
      tabs: [
        {
          id: "reading", label: t("reading_label"),
          card: `<h2>${t("reading_h2")}</h2><p>${t("reading_p1")}</p>${miniPT}<p>${t("reading_p2")}</p>`,
          games: [
            { label: t("reading_game"), href: "memorizer/" },
            { label: t("reading_ref"), href: "../reference/oxidation-states/" },
          ],
        },
        { id: "valence", label: t("valence_label"), soon: t("valence_soon") },
        {
          id: "trends", label: t("trends_label"),
          card: `<h2>${t("trends_h2")}</h2><p>${t("trends_p1")}</p><p>${t("trends_p2")}</p>`,
          games: [{ label: t("trends_game"), href: "trends/" }],
        },
      ],
    });
  </script>
</body>
</html>
