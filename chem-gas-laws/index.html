<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="home-link" href="../">&larr; Home</a>
      <p class="eyebrow">Gases &middot; Gas Laws</p>
      <h1>Gas Laws</h1>
      <p class="lede">How a gas answers to temperature, pressure, and volume &mdash; one law at a time, each with its own lab.</p>
    </header>

    <section class="game" id="topic"></section>
  </main>

  <!-- First topic screen on the shared template (TOPIC_UNIVERSE_PLAN.md). The data
       below IS the page: add a law by adding a tab, no markup surgery required. -->
  <script type="module">
    import { renderTopicScreen } from "../shared/js/topic-screen.js?v=20260812-topic1";

    renderTopicScreen(document.getElementById("topic"), {
      tabs: [
        {
          id: "charles", label: "Charles’s Law",
          card: `
            <h2>Charles&rsquo;s Law &mdash; volume follows temperature</h2>
            <p>At constant pressure, the volume of a gas is proportional to its temperature: warm a balloon and it swells, chill it and it shrinks. The particles inside don&rsquo;t change &mdash; they just push harder or softer.</p>
            <p class="law-formula">V<sub>1</sub> / T<sub>1</sub> = V<sub>2</sub> / T<sub>2</sub></p>
            <p class="law-note">Temperatures in <strong>kelvin</strong> &mdash; the proportionality only holds from absolute zero. (T in K = &deg;C + 273.15)</p>`,
          games: [{ label: "Open the Balloon Temperature Lab →", href: "charles-law/" }],
        },
        {
          id: "boyle", label: "Boyle’s Law",
          soon: "P₁V₁ = P₂V₂ — squeeze a gas into half the space and it pushes back twice as hard. Temperature sits this one out.",
        },
        {
          id: "gay-lussac", label: "Gay-Lussac’s Law",
          soon: "P₁/T₁ = P₂/T₂ — heat a sealed can and the pressure climbs. Volume sits this one out.",
        },
      ],
    });
  </script>
</body>
